<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="520" height="200" role="img" aria-labelledby="title desc">
  <title id="title">ProteoForge</title>
  <desc id="desc">A protein backbone with peptide segments; most move together, two break rank as a differential proteoform.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F2132"/>
      <stop offset="1" stop-color="#16324A"/>
    </linearGradient>
    <linearGradient id="canon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="dpf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCD34D"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Icon: 136 x 136 tile -->
  <g transform="translate(20 32)">
    <rect width="136" height="136" rx="30" fill="url(#tile)"/>
    <!-- protein backbone -->
    <rect x="18" y="94" width="100" height="4" rx="2" fill="#5B7A94"/>
    <!-- canonical peptides (dPF_0): aligned on the backbone -->
    <rect x="20" y="62" width="14" height="30" rx="7" fill="url(#canon)"/>
    <rect x="40" y="62" width="14" height="30" rx="7" fill="url(#canon)"/>
    <rect x="102" y="62" width="14" height="30" rx="7" fill="url(#canon)"/>
    <!-- discordant peptides (dPF_1): break rank together -->
    <rect x="61" y="30" width="14" height="30" rx="7" fill="url(#dpf)"/>
    <rect x="81" y="30" width="14" height="30" rx="7" fill="url(#dpf)"/>
    <rect x="58" y="24" width="40" height="42" rx="12" fill="none" stroke="#FCD34D" stroke-width="2" stroke-dasharray="4 4" opacity="0.7"/>
  </g>

  <!-- Wordmark -->
  <text x="178" y="112" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="-0.5">
    <tspan fill="#8B98A9">Proteo</tspan><tspan fill="#14B8A6">Forge</tspan>
  </text>
  <text x="180" y="142" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#8B98A9" letter-spacing="2">
    DIFFERENTIAL PROTEOFORMS
  </text>
</svg>
